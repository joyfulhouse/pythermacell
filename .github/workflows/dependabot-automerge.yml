name: Dependabot Auto-merge

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    name: Auto-merge Dependabot PRs
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'
    steps:
      - name: Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Decide how to handle this update:
      #   - patch / minor (any ecosystem)      -> auto-merge
      #   - major GitHub Actions bump          -> auto-merge (CI-only, low risk)
      #   - major bump for any other ecosystem -> approve only, require manual merge
      # fetch-metadata@v3 emits package-ecosystem "github_actions" for Actions
      # (derived from the dependabot branch name); "github-actions" is accepted
      # defensively in case that derivation changes in a future version.
      - name: Classify update
        id: classify
        env:
          UPDATE_TYPE: ${{ steps.metadata.outputs.update-type }}
          ECOSYSTEM: ${{ steps.metadata.outputs.package-ecosystem }}
        run: |
          automerge=false
          approve_only=false
          case "$UPDATE_TYPE" in
            version-update:semver-patch | version-update:semver-minor)
              automerge=true
              ;;
            version-update:semver-major)
              case "$ECOSYSTEM" in
                github_actions | github-actions) automerge=true ;;
                *) approve_only=true ;;
              esac
              ;;
          esac
          {
            echo "automerge=$automerge"
            echo "approve_only=$approve_only"
          } >> "$GITHUB_OUTPUT"
          echo "update-type=$UPDATE_TYPE ecosystem=$ECOSYSTEM -> automerge=$automerge approve_only=$approve_only"

      - name: Auto-approve and enable auto-merge
        if: steps.classify.outputs.automerge == 'true'
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr review --approve "$PR_URL"
          gh pr merge --auto --squash "$PR_URL"

      - name: Auto-approve major updates (require manual merge)
        if: steps.classify.outputs.approve_only == 'true'
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEP_NAMES: ${{ steps.metadata.outputs.dependency-names }}
        run: |
          echo "Major update detected: $DEP_NAMES"
          echo "Auto-approving but requiring manual merge for major version bumps"
          gh pr review --approve "$PR_URL" --body "Auto-approved major update. Please merge manually after reviewing changelog."
