syntax = "proto3";
package pythermacell.local;
message SessionCmd0 { bytes client_pubkey = 1; }
message SessionResp0 { int32 status = 1; bytes device_pubkey = 2; bytes device_random = 3; }
message SessionCmd1 { bytes client_verify_data = 2; }
message SessionResp1 { int32 status = 1; bytes device_verify_data = 3; }
message Sec1Payload {
  int32 msg = 1;
  oneof payload { SessionCmd0 sc0 = 20; SessionResp0 sr0 = 21; SessionCmd1 sc1 = 22; SessionResp1 sr1 = 23; }
}
message S2SessionCmd0 { bytes client_username = 1; bytes client_pubkey = 2; }
message S2SessionResp0 { int32 status = 1; bytes device_pubkey = 2; bytes device_salt = 3; }
message S2SessionCmd1 { bytes client_proof = 1; }
message S2SessionResp1 { int32 status = 1; bytes device_proof = 2; bytes device_nonce = 3; }
message Sec2Payload {
  int32 msg = 1;
  oneof payload { S2SessionCmd0 sc0 = 20; S2SessionResp0 sr0 = 21; S2SessionCmd1 sc1 = 22; S2SessionResp1 sr1 = 23; }
}
message S0SessionCmd {}
message S0SessionResp { int32 status = 1; }
message Sec0Payload { int32 msg = 1; oneof payload { S0SessionCmd sc = 20; S0SessionResp sr = 21; } }
message SessionData { int32 sec_ver = 2; oneof proto { Sec0Payload sec0 = 10; Sec1Payload sec1 = 11; Sec2Payload sec2 = 12; } }
message CmdGetPropertyCount {}
message RespGetPropertyCount { int32 status = 1; uint32 count = 2; }
message PropertyInfo { int32 status = 1; string name = 2; uint32 type = 3; uint32 flags = 4; bytes value = 5; }
message CmdGetPropertyValues { repeated uint32 indices = 1; }
message RespGetPropertyValues { int32 status = 1; repeated PropertyInfo props = 2; }
message PropertyValue { uint32 index = 1; bytes value = 2; }
message CmdSetPropertyValues { repeated PropertyValue props = 1; }
message RespSetPropertyValues { int32 status = 1; }
message LocalCtrlMessage {
  int32 msg = 1;
  oneof payload {
    CmdGetPropertyCount cmd_get_prop_count = 10;
    RespGetPropertyCount resp_get_prop_count = 11;
    CmdGetPropertyValues cmd_get_prop_vals = 12;
    RespGetPropertyValues resp_get_prop_vals = 13;
    CmdSetPropertyValues cmd_set_prop_vals = 14;
    RespSetPropertyValues resp_set_prop_vals = 15;
  }
}
